<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tower of Hanoi</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark;--bg:#10251f;--bg2:#183d32;--ink:#f7f3e8;--mute:#b8cabb;--wood:#4d3424;--wood2:#8b6842;--peg:#c7a978;--accent:#45c486;--ok:#6ddba1;--bad:#ff7777;--surface:#ffffff0d;--surface2:#ffffff12;--surface-hover:#ffffff20;--line:#ffffff26;--softline:#ffffff14;--shadow:#0003}
html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% -15%,#30634b 0,var(--bg2) 38%,var(--bg) 78%);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;user-select:none;-webkit-user-select:none}
body{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
main{max-width:1200px;margin:0 auto;padding:14px 28px}
h1{font-size:clamp(1.35rem,4vw,1.9rem);margin:0;letter-spacing:.02em;text-shadow:0 2px 16px #0006}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:14px;flex-wrap:wrap}
.lvl{display:flex;gap:6px;flex-wrap:wrap}
.lvl button{width:40px;height:40px;border-radius:12px;font-weight:800;position:relative;padding:0;background:var(--surface)}
.lvl button.cur{background:var(--accent);color:var(--bg);border-color:var(--accent);box-shadow:0 0 18px #45c48655}
.lvl button.lock{opacity:.32;cursor:not-allowed}
.lvl small{position:absolute;bottom:-2px;left:0;right:0;font-size:9px;color:var(--accent)}
.lvl button.cur small{color:var(--bg)}
button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 15px;cursor:pointer;touch-action:manipulation;transition:background .18s,border-color .18s,transform .12s}
button:hover:not(:disabled){background:var(--surface-hover);border-color:var(--accent)}
button:active{transform:scale(.97)}
button:disabled{opacity:.4;cursor:not-allowed}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.hud div{background:linear-gradient(145deg,var(--surface2),var(--surface));border:1px solid var(--softline);border-radius:14px;padding:10px;text-align:center;font-size:.68rem;letter-spacing:.08em;color:var(--mute);box-shadow:0 8px 24px var(--shadow)}
.hud b{display:block;font-size:1.25rem;letter-spacing:0;color:var(--ink);font-variant-numeric:tabular-nums}
#board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:18px 10px 0;background:linear-gradient(145deg,var(--surface2),var(--surface));border:1px solid var(--softline);border-radius:20px 20px 0 0;position:relative;box-shadow:0 18px 50px var(--shadow),inset 0 1px var(--surface2)}
.peg{position:relative;display:flex;flex-direction:column-reverse;align-items:center;padding-bottom:14px;border-radius:12px;touch-action:none}
.peg::before{content:"";position:absolute;bottom:14px;top:14px;width:10px;left:calc(50% - 5px);background:linear-gradient(90deg,#a87d45,var(--peg),#a87d45);border-radius:6px;box-shadow:0 0 12px #dfbd8233}
.peg.over{background:var(--surface2)}
.peg.sel{background:#e5b96830}
.base{height:18px;margin:0 -2px;background:linear-gradient(#d09a5e,var(--wood2) 35%,var(--wood));border-radius:0 0 12px 12px;box-shadow:0 8px 18px #0007;grid-column:1/4}
.disk{position:relative;flex:none;margin-top:2px;border-radius:999px;z-index:1;box-shadow:inset 0 3px 0 #ffffff55,inset 0 -3px 0 #0003,0 3px 7px #0006;transition:transform .12s}
.disk.lift{transform:translateY(-10px)}
.disk.hid{opacity:.25}
#ghost{position:fixed;pointer-events:none;z-index:50;display:none;transform:translate(-50%,-50%)}
.row{display:flex;gap:9px;justify-content:center;margin:16px 0;flex-wrap:wrap}
#msg{text-align:center;min-height:1.4em;margin-top:12px;font-weight:650}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
#modal .box{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:26px;text-align:center;max-width:340px;width:100%;box-shadow:0 20px 60px #000a}
#featureModal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:110;padding:16px}
.feature-box{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:22px;width:min(540px,100%);max-height:85vh;overflow:auto;box-shadow:0 20px 60px #000a}
.feature-box header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.feature-box h2{margin:0;font-size:1.3rem}
.feature-box header button{padding:6px 10px}
.feature-box p{line-height:1.6;color:var(--mute)}
.feature-box table{width:100%;border-collapse:collapse;text-align:left}
.feature-box th,.feature-box td{padding:8px 6px;border-bottom:1px solid var(--softline);font-size:.9rem}
.feature-box .feature-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.feature-box .feature-actions button{flex:1}
.feature-box .locked{color:var(--mute);opacity:.7}
#stars{font-size:2.4rem;letter-spacing:6px;margin:6px 0}
.help{font-size:.8rem;color:var(--mute);text-align:center;line-height:1.6;margin:14px auto 0;max-width:620px}
@media(max-width:600px){main{padding:16px 12px}.top{align-items:flex-start}.lvl{gap:4px}.lvl button{width:34px;height:36px;border-radius:10px;font-size:.85rem}.hud{gap:6px}.hud div{padding:8px 3px;font-size:.56rem}.hud b{font-size:1.05rem}#board{padding:14px 5px 0}.row button{padding:9px 11px;font-size:.9rem}}
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>🗼 Tower of Hanoi</h1>
    <div class="lvl" id="lvl"></div>
  </div>
  <div class="hud">
    <div>MOVES<b id="moves">0</b></div>
    <div>TIME<b id="time">0:00</b></div>
    <div>OPTIMAL<b id="opt">0</b></div>
    <div>BEST<b id="best">-</b></div>
  </div>
  <div id="board"></div>
  <div class="base" style="margin-top:-2px"></div>
  <div id="msg"></div>
  <div class="row">
    <button id="leaderboard">🏆 Leaderboard</button>
    <button id="daily">📅 Daily Challenge</button>
    <button id="achievements">🎖 Achievements</button>
    <button id="howTo">📖 How to Play</button>
    <button id="newGame">＋ New Game</button>
    <button id="difficulty">⚙ Difficulty</button>
  </div>
  <div class="help">Drag a disk to another peg, or tap a source peg and then a destination peg. Keyboard: 1, 2, 3. Larger disks cannot be placed on smaller disks.</div>
</main>
<div id="ghost"></div>
<div id="modal"><div class="box">
  <div id="winTitle" style="font-size:1.3rem;font-weight:800">You Win! 🎉</div>
  <div id="stars"></div>
  <div id="summary" style="color:var(--mute);line-height:1.6"></div>
  <div class="row"><button id="again">Play Again</button><button id="next" style="background:var(--accent);color:#222;border-color:var(--accent)">Next Level →</button></div>
</div></div>
<div id="featureModal" role="dialog" aria-modal="true" aria-labelledby="featureTitle">
  <section class="feature-box">
    <header><h2 id="featureTitle"></h2><button id="featureClose" aria-label="Close">✕</button></header>
    <div id="featureContent"></div>
  </section>
</div>
<script>
var MAX_LEVEL=5,BASE_DISKS=5,LEVEL=1,N=BASE_DISKS,pegs,count=0,sel=null,secs=0,timer=null,started=false,won=false,gameMode="level",dailyDate="",optMoves=optimal(BASE_DISKS);
var progress={unlocked:1,best:{},stars:{}};
var extra={records:[],achievements:{wins:0,firstWin:false,optimal:false,daily:false,fiveWins:false},dailyCompleted:[]};
try{var s=localStorage.getItem("hanoi-progress");if(s)progress=JSON.parse(s);}catch(e){}
try{var e=JSON.parse(localStorage.getItem("hanoi-extra")||"null");if(e&&Array.isArray(e.records)&&Array.isArray(e.dailyCompleted)){extra=e;}}catch(e){}
extra.records=extra.records.filter(function(record){return record&&typeof record.date==="string"&&typeof record.mode==="string"&&Number.isFinite(record.disks)&&Number.isFinite(record.moves)&&Number.isFinite(record.seconds);}).slice(0,10);
extra.dailyCompleted=extra.dailyCompleted.filter(function(date){return typeof date==="string";});
extra.achievements=Object.assign({wins:0,firstWin:false,optimal:false,daily:false,fiveWins:false},extra.achievements&&typeof extra.achievements==="object"?extra.achievements:{});
extra.achievements.wins=Math.max(0,Number(extra.achievements.wins)||0);
if(progress.unlocked>MAX_LEVEL)progress.unlocked=1;
progress.unlocked=Math.max(1,Math.min(progress.unlocked||1,MAX_LEVEL));
function save(){try{localStorage.setItem("hanoi-progress",JSON.stringify(progress));}catch(e){}}
function saveExtra(){try{localStorage.setItem("hanoi-extra",JSON.stringify(extra));}catch(e){}}
var $=function(i){return document.getElementById(i)};
var AC=null;
function beep(f,d,t){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.type=t||"sine";o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d);}catch(e){}}
function color(s){return "hsl("+(142+(s%4)*9)+",52%,"+(40+(s%4)*7)+"%)";}
function optimal(n){return (1<<n)-1;}
function fmt(t){return Math.floor(t/60)+":"+("0"+t%60).slice(-2);}
function shortestDistance(state){
  var start=new Array(N);
  state.forEach(function(peg,pegIndex){peg.forEach(function(disk){start[disk-1]=pegIndex;});});
  var startKey=start.join(""),goalKey=new Array(N+1).join("2"),queue=[startKey],distances=new Map([[startKey,0]]);
  for(var head=0;head<queue.length;head++){
    var key=queue[head],distance=distances.get(key);
    if(key===goalKey)return distance;
    var positions=key.split("").map(Number),tops=[-1,-1,-1];
    positions.forEach(function(peg,disk){if(tops[peg]===-1)tops[peg]=disk+1;});
    for(var from=0;from<3;from++){
      var disk=tops[from];if(disk===-1)continue;
      for(var to=0;to<3;to++){
        if(from===to||(tops[to]!==-1&&tops[to]<disk))continue;
        var next=positions.slice();next[disk-1]=to;
        var nextKey=next.join("");
        if(distances.has(nextKey))continue;
        distances.set(nextKey,distance+1);queue.push(nextKey);
      }
    }
  }
  return optimal(N);
}
function buildLevels(){
  var l=$("lvl");l.innerHTML="";l.style.display="flex";
  for(var i=1;i<=MAX_LEVEL;i++){(function(i){
    var disks=BASE_DISKS+i-1,b=document.createElement("button");b.textContent=i;b.title="Level "+i+" - "+disks+" disks";
    var locked=i>progress.unlocked;
    if(locked)b.className="lock";if(gameMode==="level"&&i===LEVEL)b.className="cur";
    var st=progress.stars[disks];if(st){var sm=document.createElement("small");sm.textContent="★".repeat(st);b.appendChild(sm);}
    b.onclick=function(){if(!locked)loadLevel(i);};l.appendChild(b);})(i);}
}
function loadLevel(level){
  LEVEL=level;gameMode="level";dailyDate="";
  startGame(BASE_DISKS+LEVEL-1,"level");buildLevels();
}
function startGame(disks,mode,initial){
  N=disks;optMoves=optimal(disks);gameMode=mode;pegs=initial?initial.map(function(peg){return peg.slice();}):[[],[],[]];
  if(!initial)for(var i=N;i>=1;i--)pegs[0].push(i);
  count=0;sel=null;secs=0;started=false;won=false;clearInterval(timer);timer=null;
  $("modal").style.display="none";$("featureModal").style.display="none";say("");buildLevels();draw();
}
function startCustomGame(disks){dailyDate="";startGame(disks,"custom");say("Custom game: "+disks+" disks.");}
function tick(){secs++;$("time").textContent=fmt(secs);}
function say(t,bad){var m=$("msg");m.textContent=t;m.style.color=bad?"var(--bad)":"var(--ink)";}
function draw(drag){
  var b=$("board");b.innerHTML="";
  var diskHeight=Math.max(12,Math.min(24,Math.floor(Math.min(310,window.innerHeight*.42)/N)));
  var pegHeight=Math.max(220,N*(diskHeight+2)+38);
  pegs.forEach(function(p,i){
    var d=document.createElement("div");d.className="peg"+(sel===i?" sel":"");d.dataset.i=i;
    d.style.height=pegHeight+"px";
    p.forEach(function(s,k){
      var x=document.createElement("div");var top=k===p.length-1;
      x.className="disk"+(top&&sel===i&&drag===undefined?" lift":"")+(top&&drag===i?" hid":"");
      x.style.width=(25+(s/N)*67)+"%";x.style.maxWidth="96%";x.style.height=diskHeight+"px";x.style.background=color(s);
      d.appendChild(x);});
    d.onpointerdown=function(e){down(e,i);};
    b.appendChild(d);});
  $("moves").textContent=count;$("time").textContent=fmt(secs);$("opt").textContent=optMoves;
  $("best").textContent=progress.best[N]||"-";
}
function canMove(f,t){var p=pegs[f],q=pegs[t];if(!p.length||f===t)return false;return !q.length||p[p.length-1]<q[q.length-1];}
function doMove(f,t){
  pegs[t].push(pegs[f].pop());
  count++;
  if(!started){started=true;timer=setInterval(tick,1000);}
  sel=null;beep(520+t*90,.12);draw();
  if(pegs[2].length===N)win();
}
function tryMove(f,t){
  if(won)return;
  if(canMove(f,t))doMove(f,t);
  else if(f!==t){say("Invalid move: larger disks cannot be placed on smaller disks.",true);beep(150,.2,"square");sel=null;draw();
    $("board").classList.remove("shake");void $("board").offsetWidth;$("board").classList.add("shake");}
}
var drag=null;
function down(e,i){
  if(won)return;e.preventDefault();
  drag={from:i,x:e.clientX,y:e.clientY,moved:false,size:pegs[i][pegs[i].length-1]};
}
window.addEventListener("pointermove",function(e){
  if(!drag||!drag.size)return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8){
    drag.moved=true;var g=$("ghost"),pegWidth=$("board").children[drag.from].getBoundingClientRect().width;
    g.style.cssText="display:block;height:"+Math.max(13,Math.min(24,Math.floor(310/N)))+"px;border-radius:12px;width:"+(pegWidth*(25+(drag.size/N)*67)/100)+"px;background:"+color(drag.size)+";box-shadow:0 6px 14px #0008";
    draw(drag.from);}
  if(drag.moved){var g=$("ghost");g.style.left=e.clientX+"px";g.style.top=e.clientY+"px";
    var el=document.elementFromPoint(e.clientX,e.clientY);var p=el&&el.closest&&el.closest(".peg");
    document.querySelectorAll(".peg").forEach(function(q){q.classList.toggle("over",q===p);});}
});
window.addEventListener("pointerup",function(e){
  if(!drag)return;var d=drag;drag=null;$("ghost").style.display="none";
  if(d.moved){var el=document.elementFromPoint(e.clientX,e.clientY);var p=el&&el.closest&&el.closest(".peg");
    sel=null;if(p)tryMove(d.from,+p.dataset.i);else draw();}
  else{clickPeg(d.from);}
});
function clickPeg(i){
  if(sel===null){if(pegs[i].length){sel=i;beep(440,.06);say("");}}
  else if(sel===i){sel=null;}
  else{tryMove(sel,i);return;}
  draw();
}
function openFeature(title,render){
  $("featureTitle").textContent=title;var content=$("featureContent");content.innerHTML="";
  render(content);$("featureModal").style.display="flex";
}
function makeDailyPosition(date,disks){
  var seed=2166136261;
  for(var i=0;i<date.length;i++)seed=Math.imul(seed^date.charCodeAt(i),16777619)>>>0;
  var state=[[],[],[]];for(var d=disks;d>=1;d--)state[0].push(d);
  function random(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;}
  for(var step=0;step<disks*5+12;step++){
    var choices=[];
    for(var from=0;from<3;from++)for(var to=0;to<3;to++){
      if(from!==to&&state[from].length&&(!state[to].length||state[from][state[from].length-1]<state[to][state[to].length-1]))choices.push([from,to]);
    }
    var move=choices[Math.floor(random()*choices.length)];
    state[move[1]].push(state[move[0]].pop());
  }
  while(state[2].length===disks){
    var from=2,to=(Math.floor(random()*2));
    if(state[from].length&&(!state[to].length||state[from][state[from].length-1]<state[to][state[to].length-1]))state[to].push(state[from].pop());
  }
  return state;
}
function todayString(){return new Date().toISOString().slice(0,10);}
function todayDiskCount(date){return 3+(Math.floor(new Date(date+"T00:00:00Z").getTime()/86400000)%7);}
function startDailyChallenge(){
  dailyDate=todayString();var disks=todayDiskCount(dailyDate);
  startGame(disks,"daily",makeDailyPosition(dailyDate,disks));
  optMoves=shortestDistance(pegs);$("opt").textContent=optMoves;
  say("Daily challenge · "+dailyDate+" · "+disks+" disks");
}
function startNewGame(){loadLevel(1);}
function showLeaderboard(){
  openFeature("🏆 Leaderboard",function(content){
    if(!extra.records.length){content.textContent="No completed games yet. Win a game to add your first score.";return;}
    var table=document.createElement("table"),head=document.createElement("tr");
    ["Date","Mode","Disks","Moves","Time"].forEach(function(label){var th=document.createElement("th");th.textContent=label;head.appendChild(th);});
    table.appendChild(head);
    extra.records.slice(0,10).forEach(function(record){
      var row=document.createElement("tr");
      [record.date,record.mode,record.disks,record.moves,fmt(record.seconds)].forEach(function(value){var td=document.createElement("td");td.textContent=value;row.appendChild(td);});
      table.appendChild(row);
    });
    content.appendChild(table);
  });
}
function showAchievements(){
  var items=[
    ["firstWin","First Win","Complete any puzzle."],
    ["optimal","Perfect Solve","Complete a puzzle in the minimum number of moves."],
    ["daily","Daily Challenger","Complete a daily challenge."],
    ["fiveWins","Puzzle Fan","Win five puzzles."]
  ];
  openFeature("🎖 Achievements",function(content){
    items.forEach(function(item){
      var p=document.createElement("p");p.className=extra.achievements[item[0]]?"":"locked";
      p.textContent=(extra.achievements[item[0]]?"✓ ":"🔒 ")+item[1]+" — "+item[2];content.appendChild(p);
    });
    var countText=document.createElement("p");countText.textContent="Total wins: "+(extra.achievements.wins||0);content.appendChild(countText);
  });
}
function showDifficulty(){
  openFeature("⚙ Choose difficulty",function(content){
    var p=document.createElement("p");p.textContent="Choose how many disks to play with.";content.appendChild(p);
    var actions=document.createElement("div");actions.className="feature-actions";
    [[3,"Easy"],[5,"Normal"],[7,"Hard"],[9,"Expert"]].forEach(function(option){
      var button=document.createElement("button");button.textContent=option[1]+" · "+option[0]+" disks";
      button.onclick=function(){startCustomGame(option[0]);};
      actions.appendChild(button);
    });
    content.appendChild(actions);
  });
}
function showHowTo(){
  openFeature("📖 How to Play",function(content){
    var p=document.createElement("p");p.textContent="Move every disk to the rightmost peg to solve the puzzle.";content.appendChild(p);
    var list=document.createElement("ol");
    ["Move one disk at a time.","Only move the top disk on a peg.","Never place a larger disk on a smaller disk.","Drag a disk, or tap its peg and then the destination peg. Use keys 1, 2, and 3 to select pegs."].forEach(function(rule){var li=document.createElement("li");li.textContent=rule;list.appendChild(li);});
    content.appendChild(list);
    var note=document.createElement("p");note.textContent="The fewest possible moves are 2ⁿ − 1, where n is the number of disks.";content.appendChild(note);
  });
}
function win(){
  won=true;clearInterval(timer);timer=null;beep(660,.15);setTimeout(function(){beep(880,.15)},150);setTimeout(function(){beep(1100,.3)},300);
  var o=optMoves,st=count<=o?3:count<=o*1.5?2:1;
  if(!progress.best[N]||count<progress.best[N])progress.best[N]=count;
  if(!progress.stars[N]||st>progress.stars[N])progress.stars[N]=st;
  if(gameMode==="level"&&LEVEL>=progress.unlocked&&LEVEL<MAX_LEVEL)progress.unlocked=LEVEL+1;
  extra.achievements.wins=(extra.achievements.wins||0)+1;
  extra.achievements.firstWin=true;
  if(count<=o)extra.achievements.optimal=true;
  var recordDate=gameMode==="daily"?dailyDate:todayString();
  if(gameMode==="daily"){
    extra.achievements.daily=true;
    if(extra.dailyCompleted.indexOf(dailyDate)<0)extra.dailyCompleted.push(dailyDate);
  }
  extra.records.push({date:recordDate,mode:gameMode==="daily"?"Daily":gameMode==="custom"?"Custom":"Level "+LEVEL,disks:N,moves:count,seconds:secs});
  extra.records.sort(function(a,b){return a.moves-b.moves||a.seconds-b.seconds;});
  extra.records=extra.records.slice(0,10);
  if(extra.achievements.wins>=5)extra.achievements.fiveWins=true;
  save();saveExtra();buildLevels();
  $("stars").textContent="★".repeat(st)+"☆".repeat(3-st);$("stars").style.color="var(--accent)";
  $("winTitle").textContent=gameMode==="daily"?"Daily Challenge Complete! 🎉":"Puzzle Solved! 🎉";
  $("summary").textContent=count+" moves (optimal: "+o+")\nTime: "+fmt(secs);
  $("summary").style.whiteSpace="pre-line";
  $("next").style.display=gameMode==="level"&&LEVEL<MAX_LEVEL?"":"none";
  draw();setTimeout(function(){$("modal").style.display="flex";},450);
}
$("leaderboard").onclick=showLeaderboard;
$("daily").onclick=startDailyChallenge;
$("achievements").onclick=showAchievements;
$("howTo").onclick=showHowTo;
$("newGame").onclick=startNewGame;
$("difficulty").onclick=showDifficulty;
$("featureClose").onclick=function(){$("featureModal").style.display="none";};
$("featureModal").onclick=function(e){if(e.target===$("featureModal"))$("featureModal").style.display="none";};
$("again").onclick=startNewGame;
$("next").onclick=function(){loadLevel(Math.min(MAX_LEVEL,LEVEL+1));};
document.addEventListener("keydown",function(e){
  if(e.key>="1"&&e.key<="3")clickPeg(+e.key-1);
  else if(e.key==="r")startNewGame();
  else if(e.key==="Escape"){$("featureModal").style.display="none";$("modal").style.display="none";}});
loadLevel(1);
</script>
